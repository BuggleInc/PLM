# This workflow builds PLM with Maven and runs its test suite.
# See https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-java-with-maven
name: Java CI

on:
  push:
    branches: [ javaUI ]
  pull_request:
    branches: [ javaUI ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install gettext (needed by the i18n message-bundle generation)
      run: sudo apt-get update && sudo apt-get install -y gettext
    # Scala 2.12's compiler bridge does not run on JDK 22+, and maven.compiler.release is 17.
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build the self-contained jar with Maven
      run: mvn -B -DskipTests package
    - name: Upload jar
      uses: actions/upload-artifact@v6
      with:
        path: target/*.jar

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v6
    - name: Install gettext (i18n) and xvfb (PLM's tests are Swing/GUI)
      run: sudo apt-get update && sudo apt-get install -y gettext xvfb
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    # The tests need an X display; run them under a virtual framebuffer.
    - name: Run the test suite
      run: xvfb-run -a mvn -B test
