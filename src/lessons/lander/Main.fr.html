<h1>Alunisseur</h1>

<p>Dans cette leçon, vous pilotez un alunisseur dans des situations de plus en
plus complexes.</p>

<p>À chaque pas de la simulation, le joueur donne des commandes contrôlant
l'angle et la poussée du module d'alunissage.</p>
